---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/urlscan"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      package-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/loki"
      - "/memory/generate_profiles"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/osv-scanner"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
