---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/urlscan"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      package-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/loki"
      - "/memory/generate_profiles"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/osv-scanner"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # The "docker" ecosystem only reads Dockerfiles; images in compose files need this one
  - package-ecosystem: "docker-compose"
    directories:
      - "/network"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # Patch/minor only: RITA needs mongo 4.2, and Elastic 7.17 -> 9 is a migration
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-deps:
        patterns:
          - "*"
